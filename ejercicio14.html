<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadenas de numeros</title>
    <script src="js/ejercicio14.js"></script>
</head>
<body>

    <div class="div1">
        <h2>Operaciones Arreglos de Números</h2>

        <label for="cadenaNumeros">Ingresa números separados por (,)</label>
        <input type="text" name="cadenaNumeros" id="cadenaNumeros" placeholder="Ej. 10, 20, 30, 40, 50">

        <input type="button" value="Calcular" onclick="calcularOperaciones()">
        <br>
        <label for="mayor">Número mayor</label>
        <input type="text" name="mayor" id="mayor" readonly>
        <br>
        <label for="menor">Número menor</label>
        <input type="text" name="menor" id="menor" readonly>
        <br>
        <label for="promedio">Promedio</label>
        <input type="text" name="promedio" id="promedio" readonly>
    </div>

</body>
</html>
