<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor MXN a USD</title>
    <script src="js/ejercicio12.js"></script>
</head>
<body>

    <div class="div1">
        <h2>Pesos (MXN) a Dólares (USD)</h2>

        <label for="mxn">Cantidad (MXN)</label>
        <input type="number" name="mxn" id="mxn" placeholder="Ej. 500" min="0" step="any">

        <input type="button" value="Convertir" onclick="convertirr()">

        <label for="usd">Cantidad (USD)</label>
        <input type="text" name="usd" id="usd" readonly>
    </div>

</body>
