<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio con Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 m-0">

    <div class="container my-5" style="max-width: 500px;">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h2 class="card-title text-center text-primary mb-4 fs-4 fw-bold">Lista Dinámica de Elementos</h2>

                <div class="input-group mb-3">
                    <input type="text" id="nuevoElemento" class="form-control" placeholder="Escribe un elemento..." aria-label="Elemento">
                    <button id="agregarBtn" class="btn btn-primary fw-bold" type="button">Agregar</button>
                </div>

                <ul id="lista" class="list-group"></ul>
            </div>
        </div>
    </div>

    <script src="js/ejercicio18.js"></script>
</body>
</html>
